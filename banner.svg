<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner Cristhian Marcelo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="55%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#06182b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'Fira Code', 'Courier New', monospace;
      font-size: 76px;
      font-weight: 800;
      letter-spacing: 10px;
      fill: url(#txt);
      stroke: #22d3ee;
      stroke-width: 1.2;
      stroke-dasharray: 1600;
      stroke-dashoffset: 1600;
      fill-opacity: 0;
      animation: draw 3.2s ease forwards, fillin 1.4s ease 2.6s forwards, pulse 4s ease-in-out 4s infinite;
    }
    .sub {
      font-family: 'Segoe UI', 'Fira Code', 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 2px;
      fill: #93c5fd;
      opacity: 0;
      animation: fadeup 1.6s ease 3.2s forwards;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      letter-spacing: 4px;
      fill: #22d3ee;
      opacity: 0;
      animation: fadeup 1.4s ease 3.8s forwards;
    }
    .line {
      stroke: #22d3ee;
      stroke-width: 1;
      stroke-opacity: 0.35;
      stroke-dasharray: 6 8;
      animation: flow 6s linear infinite;
    }
    .node {
      fill: #22d3ee;
      animation: blink 3s ease-in-out infinite;
    }
    .node.b { fill: #38bdf8; animation-duration: 4s; }
    .node.c { animation-delay: 1s; }
    .node.d { animation-delay: 2s; }
    .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 600px 160px; }
    .scan {
      animation: scan 7s linear infinite;
    }
    .cursor {
      fill: #22d3ee;
      animation: caret 1s steps(1) infinite;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: 1; stroke-opacity: 0.25; } }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(34,211,238,0.35)); }
      50% { filter: drop-shadow(0 0 16px rgba(34,211,238,0.85)); }
    }
    @keyframes fadeup {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes flow { to { stroke-dashoffset: -140; } }
    @keyframes blink {
      0%, 100% { opacity: 0.25; r: 3; }
      50% { opacity: 1; r: 5; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes scan {
      from { transform: translateY(-20px); }
      to { transform: translateY(340px); }
    }
    @keyframes caret { 50% { opacity: 0; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse class="halo" cx="600" cy="160" rx="420" ry="130" fill="url(#glow)"/>

  <g>
    <line class="line" x1="90" y1="70" x2="230" y2="150"/>
    <line class="line" x1="230" y1="150" x2="150" y2="250"/>
    <line class="line" x1="230" y1="150" x2="380" y2="60"/>
    <line class="line" x1="380" y1="60" x2="520" y2="40"/>
    <line class="line" x1="150" y1="250" x2="330" y2="275"/>
    <line class="line" x1="330" y1="275" x2="470" y2="290"/>
    <line class="line" x1="1110" y1="60" x2="980" y2="140"/>
    <line class="line" x1="980" y1="140" x2="1060" y2="245"/>
    <line class="line" x1="980" y1="140" x2="830" y2="55"/>
    <line class="line" x1="830" y1="55" x2="700" y2="35"/>
    <line class="line" x1="1060" y1="245" x2="880" y2="278"/>
    <line class="line" x1="880" y1="278" x2="740" y2="292"/>

    <circle class="node" cx="90" cy="70" r="4"/>
    <circle class="node b c" cx="230" cy="150" r="5"/>
    <circle class="node d" cx="150" cy="250" r="4"/>
    <circle class="node b" cx="380" cy="60" r="4"/>
    <circle class="node c" cx="520" cy="40" r="3"/>
    <circle class="node" cx="330" cy="275" r="4"/>
    <circle class="node b d" cx="470" cy="290" r="3"/>
    <circle class="node" cx="1110" cy="60" r="4"/>
    <circle class="node b d" cx="980" cy="140" r="5"/>
    <circle class="node c" cx="1060" cy="245" r="4"/>
    <circle class="node b" cx="830" cy="55" r="4"/>
    <circle class="node d" cx="700" cy="35" r="3"/>
    <circle class="node" cx="880" cy="278" r="4"/>
    <circle class="node b c" cx="740" cy="292" r="3"/>
  </g>

  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity="0.08"/>

  <text class="title" x="600" y="165" text-anchor="middle">CRISTHIAN MARCELO</text>
  <text class="sub" x="600" y="212" text-anchor="middle">Desarrollo de Software (5º Ciclo) en SENATI  |  Becario PRONABEC (Beca 18)</text>
  <text class="tag" x="600" y="250" text-anchor="middle">&lt; FULL STACK · IoT · MOBILE /&gt;</text>
  <rect class="cursor" x="835" y="236" width="8" height="18" opacity="0"/>
</svg>
